# Release: a tag builds the Linux binary and attaches it, plus the deb,
# the rpm, the flatpak bundles (one leg per architecture), and the
# Orchard publish (the flatpak store, github.com/Letdown2491/orchard).
# Linux-only by decision (the ports are scoped in DESIGN.md); the
# container spec's library list is what `gertie` links against, spelled
# out here as apt lines because CI has no containerfile.
#
# Trigger: push a tag shaped v1.2.3 (the v prefix matches the doctor's
# `--check-updates` comparison, which strips it). Everything else
# (draft text, the version bump itself) is manual, on purpose: a
# release is a claim, not a side effect.
#
# Secrets:
#   ORCHARD_NSEC  the publisher's Nostr key (set before the Orchard
#                 publish leg goes live; flatpak bundles attach without it).
#
# Every third-party action is pinned to the commit SHA of the release
# it was audited at (version named in the comment, never a floating
# tag): this workflow holds contents:write, so a moved tag is a code
# path into the release. Renew the pins deliberately.

name: release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io/letdown2491/gertie-flatpak

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install the Rust toolchain
        # dtolnay/rust-toolchain, the stable branch, audited here by
        # commit; renewal is a deliberate diff.
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Install the client libraries gertie links
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libvulkan-dev

      - name: Build the release binary
        run: cargo build --release --locked -p gertie

      - name: Build the deb
        run: |
          # Version-pinned: an unpinned `cargo install` is a code path
          # into the artifacts this workflow ships.
          cargo install cargo-deb --locked --version 3.8.0
          cargo deb -p gertie --no-build
          # Smoke: the deb parses and its payload carries the expected paths.
          dpkg-deb --info target/debian/*.deb | head -20

      - name: Build the rpm
        run: |
          cargo install cargo-generate-rpm --locked --version 0.21.1
          cargo generate-rpm -p gertie
          # Smoke: the rpm reads back (rpmlint is not installed; the
          # header listing is the check).
          rpm -q --info target/generate-rpm/*.rpm || rpm2cpio target/generate-rpm/*.rpm | cpio -it | head

      - name: Smoke-check the binary
        run: |
          ./target/release/gertie --version
          ./target/release/gertie doctor || true

      - name: Checksum the artifacts
        # The digest file ships next to the artifacts on the release
        # page: a download can be verified without trusting the
        # connection, which is the floor under any future signing
        # story. Basenames only, so `sha256sum -c` works from a flat
        # download directory instead of failing on target/ paths.
        run: |
          (cd target/release && sha256sum gertie) > SHA256SUMS
          (cd target/debian && sha256sum *.deb) >> SHA256SUMS
          (cd target/generate-rpm && sha256sum *.rpm) >> SHA256SUMS
          cat SHA256SUMS

      - name: Attach the artifacts to the release
        # softprops/action-gh-release v2.3.4
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7
        with:
          files: |
            target/release/gertie
            target/debian/*.deb
            target/generate-rpm/*.rpm
            SHA256SUMS
          generate_release_notes: true

  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-x86_64
            runner: ubuntu-24.04
          - arch: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install the toolchain and libraries
        run: |
          sudo apt-get update
          # librsvg2-common: the gdk-pixbuf SVG loader. build-export
          # validates the exported icons through gdk-pixbuf, and with
          # the loader missing the scalable SVG dies with "Format not
          # recognized" even though the file is fine.
          sudo apt-get install -y flatpak podman file librsvg2-common
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libvulkan-dev

      - name: Build the release binary
        run: cargo build --release --locked -p gertie

      - name: Assemble and prepare the app tree (no publish, no key needed)
        run: ./self/assemble.sh

      - name: Export and bundle the flatpak
        # self/tree is already a build directory (files/, export/,
        # metadata), so there is no build-init: it would create a
        # second build directory, and build-export pointed at it dies
        # with "opening repo: opendir(objects)" (the v1.0.1 runs).
        # build-export makes the ostree repo at repo/ itself, from the
        # tree; its third argument is the branch, and the default is
        # master, not stable. build-bundle's --runtime flag means the
        # bundle IS a runtime, not "include the runtime", so it is
        # left off; the app branch carries the runtime dependency. The
        # Platform and Sdk install from flathub so the runtime refs
        # resolve on the runner, whether or not the local flatpak
        # validates them.
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --no-deps flathub \
            org.freedesktop.Platform/${{ matrix.arch == 'linux-x86_64' && 'x86_64' || 'aarch64' }}/25.08 \
            org.freedesktop.Sdk/${{ matrix.arch == 'linux-x86_64' && 'x86_64' || 'aarch64' }}/25.08
          mkdir -p bundles repo
          flatpak build-export repo self/tree stable
          flatpak build-bundle repo \
            "bundles/gertie-${GITHUB_REF_NAME#v}-${{ matrix.arch }}.flatpak" \
            io.github.Letdown2491.gertie stable

      - name: Checksum the bundles
        # Same basename rule as the binary's SHA256SUMS, per arch so
        # the two matrix legs cannot collide on one file.
        run: (cd bundles && sha256sum *.flatpak > "SHA256SUMS-${{ matrix.arch }}.txt")

      - name: Attach the flatpak bundles to the release
        # softprops/action-gh-release v2.3.4
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7
        with:
          files: |
            bundles/*.flatpak
            SHA256SUMS-${{ matrix.arch }}.txt
          generate_release_notes: true

      - name: Save the staged tree for the publish job
        # orchard-publish packs the app tree (files/, export/,
        # metadata), not the bundle. One tar per leg; the publish job
        # prepares both trees and signs the listing once.
        run: tar -C self/tree -czf app-tree.tar.gz export files metadata
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-tree-${{ matrix.arch }}
          path: app-tree.tar.gz
          retention-days: 1

  orchard:
    needs: flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Version from the tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build orchard-publish from Orchard's pinned tag
        run: |
          git clone --quiet --depth 1 --branch v0.3.0 \
            https://github.com/Letdown2491/orchard /tmp/orchard
          test "$(git -C /tmp/orchard rev-parse HEAD)" = f2e4635cb44722f104c4fd28d86616f114baf157
          cd /tmp/orchard
          # the crate moved under crates/ (the old path dies with "is
          # not a directory"); --locked pins its Cargo.lock
          cargo install --locked --path crates/orchard-publish

      - name: Download the staged trees
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: app-tree-*
          path: trees

      - name: Prepare both trees (no key, no network)
        # one prepare per arch, from that arch's staged tree; --arch
        # also overrides the manifest's arch, which the prepared asset
        # records. ORCHARD_PUBLISH_VERSION must match the signing
        # run's, or the coverage check sees two different versions.
        env:
          ORCHARD_PUBLISH_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p prepared
          for dir in trees/app-tree-*; do
            arch=${dir##*/app-tree-}
            rm -rf self/tree
            mkdir -p self/tree
            tar -xzf "$dir/app-tree.tar.gz" -C self/tree
            orchard-publish self/gertie.publish.toml \
              --arch "$arch" --prepare --out "prepared/$arch"
          done
          find prepared -type f | sort

      - name: Push to the registry and sign the listing (requires the ORCHARD_NSEC secret)
        # One signing run for both arches: this pin of orchard-publish
        # refuses a listing whose assets do not cover every declared
        # platform, so signing per arch leg (riddim's shape under its
        # older pin) is not available here. --tag stays at the
        # manifest's "latest": the publisher appends the platform
        # itself (latest-linux-x86_64, latest-linux-aarch64). --prove
        # writes orchard.txt to this repo (public, contents:write) so
        # the listing's repository link verifies in clients.
        if: ${{ vars.ORCHARD_NSEC_SET == 'true' }}
        env:
          ORCHARD_PUBLISH_VERSION: ${{ steps.ver.outputs.version }}
          ORCHARD_NSEC: ${{ secrets.ORCHARD_NSEC }}
          ORCHARD_REGISTRY_USER: ${{ github.actor }}
          ORCHARD_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          orchard-publish self/gertie.publish.toml \
            --asset "prepared/linux-x86_64/io.github.Letdown2491.gertie-linux-x86_64.asset.json" \
            --asset "prepared/linux-aarch64/io.github.Letdown2491.gertie-linux-aarch64.asset.json" \
            --registry "$REGISTRY" --prove
