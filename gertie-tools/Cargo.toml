[package]
name = "gertie-tools"
description = "gertie's built-in tools and MCP client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gertie-core = { workspace = true }
futures-core = { version = "0.3", features = ["alloc"] }
glob = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The oneshot bridging a tool's OS thread back into the async loop.
tokio = { version = "1", features = ["sync"] }
walkdir = "2"
# Kernel-level filesystem sandbox for bash children (opt-in).
landlock = "0.4"
# killpg for the bash timeout: the whole process group goes home.
libc = "0.2"
# Same reqwest fork the provider uses: one TLS stack in the binary.
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["rustls-tls", "json", "blocking"] }

[dev-dependencies]
tempfile = "3"
