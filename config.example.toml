# Gertie config: copy to ~/.config/gertie/config.toml and edit.
# Keys resolve in order: api_key_env → GERTIE_<NAME>_API_KEY / <NAME>_API_KEY
# env vars → a literal `api_key` (allowed, but Gertie warns about it in the
# status line, and the file should be chmod 600 if you use one).

[[endpoints]]
name = "mine"
base_url = "https://your-provider.example/v1"   # any OpenAI-compatible server
model = "the-model-id"                          # the id your endpoint serves
api_key_env = "MY_API_KEY"
# api_key = "sk-your-key"   # or inline, if you must
# context_window = 1046576  # tokens; unset = compaction disabled

# A local model needs no key:
# [[endpoints]]
# name = "ollama"
# base_url = "http://127.0.0.1:11434/v1"
# model = "qwen3-coder"
# context_window = 32768

# Replay: scripted scenarios instead of a model, dev/test only, zero
# tokens. The model name picks the scenario: "showcase" and "approval"
# ship embedded; any other name loads <base_url>/<model>.toml. Drivers
# the real loop, permission cards and all; nothing leaves the machine.
# [[endpoints]]
# name = "replay"
# base_url = "~/lib/gertie-scenarios"   # where your .toml scenarios live
# wire = "replay"
# model = "showcase"

# MCP servers: either a spawned process (stdio) or a remote URL
# (Streamable HTTP). Every MCP tool call prompts, third-party tools
# are untrusted by default.
# [[mcp_servers]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
# [mcp_servers.env]
# NODE_ENV = "production"
#
# [[mcp_servers]]
# name = "remote"
# url = "https://mcp.example.com/mcp"

# Security posture. sandbox_bash = true Landlock-isolates bash children:
# system read-only, writes limited to the workspace and /tmp, and
# outbound TCP closed (connects and binds are refused, so an approved
# command cannot open a channel; UDP/DNS and ICMP stay, Landlock ABI v4
# is TCP-only). Opt-in; when the kernel can't enforce it (6.7+ wanted;
# older kernels refuse the whole sandbox), sandboxed commands fail
# rather than run free.
# sandbox_netns = true escalates further: the child moves into a fresh
# user+network namespace, closing UDP/DNS and ICMP too (true no-network;
# needs unprivileged user namespaces, and fails closed where refused).
# [security]
# sandbox_bash = true
# sandbox_netns = true

# The permission mode new sessions open in: "supervised" (every write
# and command prompts), "accept_edits" (checkpointed file edits run
# unasked; commands still prompt), "auto" (sandboxed work runs unasked
# too, with sandbox_bash off this prompts like accept_edits), or
# "full_access" (nothing prompts). Sessions keep whatever mode you set
# in the composer; this only sets the starting posture.
# [permissions]
# default_mode = "accept_edits"

# The sidebar's lifecycle. Settling a session (✓ on its row) folds it
# out of the active list; opening it brings it back.
#
# Auto-settle chats idle for at least this many days, on startup.
# Absent = off: settle stays manual until you opt in. The sweep only
# changes state; it never runs the settle command.
# auto_settle_days = 3
#
# A shell command a MANUAL settle runs in the settling session's
# recorded workspace, reclaiming the checkout's disk. Never run by the
# auto sweep: a human pressed the button.
# settle_command = "cargo clean"

# Web search: web_search explains itself until a backend is configured.
# [search]
# backend = "brave"          # or "searxng"
# api_key_env = "BRAVE_API_KEY"
# base_url = "https://searx.example"   # searxng only; must allow format=json

# Subagent types. Each model-invoked type becomes an agent_{name} tool
# the leader can spawn (depth 1, workers never get agent tools).
# Dispatch is by brief file: the leader writes a self-contained brief
# and passes its workspace path.
#
# Eight types ship built in (explore, plan, implement, test, debug,
# review, research, librarian) and need no config. An entry below with
# the same name replaces the built-in; extra names are added on top.
#
# [[agents]]
# name = "reviewer"
# description = "Use when code needs review before it ships. Read-only."
# tools = ["read_file", "glob", "grep", "load_skill"]   # critic-only: no writes
# model = "a-cheaper-model"    # per-type model override (same endpoint)
# prompt = """
# You are a code reviewer. Read the code named in the brief. Judge
# correctness first, then security, then clarity. Every finding cites a
# file and line. Verify claims by reading, never by assuming.
# """
#
# A worker can also live on a different endpoint, the name of any
# [[endpoints]] entry above, its wire included. That is what makes a
# council possible: several models, one diff, one verdict each (the
# bundled `council` skill runs the loop). A pin to a missing endpoint
# warns at startup and the agent is skipped: no silent substitution.
#
# [[endpoints]]
# name = "anthropic"
# base_url = "https://api.anthropic.com"
# wire = "anthropic"
# model = "claude-opus-4-6"
# api_key_env = "ANTHROPIC_API_KEY"
#
# [[agents]]
# name = "council-anthropic"
# description = "Use when a council review runs. Read-only."
# endpoint = "anthropic"
# tools = ["read_file", "glob", "grep", "load_skill"]

# default_endpoint = "mine"   # defaults to the first listed endpoint

# Long-term memory (M6). The store is markdown files (.gertie/memory/
# in this repo, plus a global tier in the data dir); the tools
# (memory, search_memory) are always available. Extraction turns
# settled or compacted sessions into proposed entries, shown as a
# review card you approve or deny. On by default (the read path
# costs nothing until the store has entries); the token footer's
# cached-% is the scoreboard.
#[memory]
#enabled = true
## The frozen index's token budget (roughly, chars/4).
#index_budget = 600
## Endpoint name for the session-end extraction call. Absent = the
## session's own endpoint.
#extract_endpoint = "ppq"
## Consolidate (merge duplicates, archive counter-dead entries,
## rebuild the index) at most this often, riding the startup sweep.
## Default 7; zero = never.
#dream_days = 7

# Turn budgets. A turn that loops this many tool rounds without
# finishing gets a wrap-up nudge, then this many grace rounds to land
# it before the turn pauses (resumable, history intact). Defaults:
# 60 + 10. Raise max_tool_rounds further for especially long work;
# the pause still stops runaway loops. Empty settings fields show
# the defaults as placeholders.
#[turn]
#max_tool_rounds = 60
#grace_rounds = 10
